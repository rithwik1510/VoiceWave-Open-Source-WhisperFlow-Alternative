<html lang="en">
  <head>

    <title>VoiceWave Local Core</title>
    <script>
      // Paint the last resolved theme before first paint (plan 014); the real
      // setting reconciles this once load_settings resolves.
      try {
        var t = localStorage.getItem("vw-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
