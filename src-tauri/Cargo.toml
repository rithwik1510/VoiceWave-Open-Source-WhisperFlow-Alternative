[package]
name = "voicewave_core"
version = "0.5.1"
edition = "2021"
description = "VoiceWave Phase I local core"
default-run = "voicewave_core"

[lib]
name = "voicewave_core_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
whisper-cuda = ["whisper-rs/cuda"]
whisper-vulkan = ["whisper-rs/vulkan"]

[dependencies]
aes-gcm = "0.10.3"
arboard = "3.5.0"
base64 = "0.22.1"
cpal = "0.15.3"
directories = "5.0.1"
ed25519-dalek = "2.1.1"
rand = "0.8.5"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tauri = { version = "2.10", features = ["tray-icon"], optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
thiserror = "2.0.12"
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.13"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
whisper-rs = "0.15.1"
ureq = "2.12.0"

[dev-dependencies]
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[patch.crates-io]
whisper-rs = { path = "../vendor/whisper-rs" }
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }

# `npm run tauri:dev` builds the dev profile, and that binary is what gets
# daily-driven during development. At opt-level 0 the per-dictation audio DSP
# (conditioning, resampling, VAD) runs 5-20x slower and shows up directly as
# release-to-text latency (observed: ~350 ms conditioning on a 30 s dictation
# that takes ~30 ms optimized). opt-level 1 recovers most of that while
# keeping incremental compiles fast; dependencies get full optimization since
# they rarely recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
