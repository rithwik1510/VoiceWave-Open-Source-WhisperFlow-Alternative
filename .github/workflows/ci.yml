name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 6 * * 1"

jobs:
  docs_format_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Prettier
        run: npm install --global prettier

      - name: Check formatting
        run: prettier --check "**/*.{md,yml,yaml,json}"

  markdown_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      - name: Markdown lint
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#dist" "#Idea.md"

  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phase0_artifact_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Phase 0 artifacts
        shell: pwsh
        run: ./scripts/ci/check-phase0-artifacts.ps1

  frontend_quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test

      - name: Run frontend coverage gate
        shell: pwsh
        run: npm run quality:frontend:gate

      - name: Run frontend build
        run: npm run build

  dependency_security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary: compiling cargo-audit from source took minutes per run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency policy gate
        shell: pwsh
        run: npm run security:deps -- -Enforce

  rust_quality:
    runs-on: windows-latest
    env:
      # The backend gate's cargo check otherwise builds into its own
      # C:\voicewave-tauri target dir, which the cache below never sees.
      VIBE_SAFE_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches compiled dependencies (whisper included) between runs; the
      # first run on a new Cargo.lock still builds from scratch.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Cargo desktop-feature compile check
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      # Runs cargo check, the core tests (cargo test --no-default-features)
      # and the test-count floor.
      - name: Backend quality gate
        shell: pwsh
        run: npm run quality:backend:gate

  release_gate:
    runs-on: windows-latest
    needs:
      - frontend_quality
      - rust_quality
      - dependency_security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Firestore rules contract gate
        shell: pwsh
        run: npm run security:firestore-rules -- -Enforce

      # The jobs this one needs already ran the tests, builds and security
      # gates; here only the release-specific checks run.
      - name: Run release gate
        shell: pwsh
        run: npm run release:gate -- -SkipRepeatedChecks
