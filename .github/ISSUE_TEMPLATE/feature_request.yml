name: Feature request
description: Suggest an idea or improvement for VoiceWave.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem behind the request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The change you have in mind, if any.
